<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Gammee – Survive the Hunt</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0d1a;--accent:#7c3aed;--accent2:#06b6d4;--text:#f1f5f9;--muted:#94a3b8}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100dvh;overflow:hidden;user-select:none}
#app{position:relative;width:min(900px,100vw);aspect-ratio:16/9}
#gameCanvas{display:block;width:100%;height:100%;border-radius:12px;box-shadow:0 0 60px #7c3aed55}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(13,13,26,.82);backdrop-filter:blur(6px);border-radius:12px}
.overlay.hidden{display:none}
.overlay h1{font-size:clamp(2.5rem,8vw,5rem);font-weight:900;letter-spacing:.12em;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.overlay h2{font-size:clamp(1.8rem,5vw,3rem);font-weight:800;color:#f87171}
.subtitle{font-size:1.1rem;color:var(--muted);letter-spacing:.2em;text-transform:uppercase}
.btn{margin-top:8px;padding:.7em 2.6em;font-size:1.1rem;font-weight:700;letter-spacing:.1em;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:50px;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 0 20px #7c3aed88}
.btn:hover{transform:scale(1.06);box-shadow:0 0 32px #7c3aedaa}
.btn:active{transform:scale(.97)}
.hint{font-size:.8rem;color:var(--muted)}
kbd{background:#ffffff18;border:1px solid #ffffff30;border-radius:4px;padding:1px 5px;font-family:inherit}
#finalScore,#highScore{font-size:1.1rem;color:var(--muted)}
#finalScore span,#highScore span{color:var(--accent2);font-weight:700}
.death-msg{font-size:1.25rem;font-weight:700;color:#f87171;letter-spacing:.04em}
.enemy-preview{display:flex;gap:18px;margin:4px 0}
.ep{font-size:.95rem;padding:.3em .9em;border-radius:50px;font-weight:600}
.ep.snake{background:#14532d55;color:#4ade80;border:1px solid #16a34a}
.ep.fish{background:#0c4a6e55;color:#38bdf8;border:1px solid #0ea5e9}
.ep.human{background:#1e1b4b55;color:#a78bfa;border:1px solid #7c3aed}
#hud{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;font-size:.9rem;font-weight:600;color:var(--text);pointer-events:none}
#hud.hidden{display:none}
</style>
</head>
<body>
<div id="app">
  <canvas id="gameCanvas"></canvas>
  <div id="startScreen" class="overlay">
    <h1>GAMMEE</h1>
    <p class="subtitle">Survive the Hunt</p>
    <div class="enemy-preview">
      <span class="ep snake">🐍 Snakes</span>
      <span class="ep fish">🐟 Flying Fish</span>
      <span class="ep human">🏃 You</span>
    </div>
    <button id="startBtn" class="btn">RUN!</button>
    <p class="hint"><kbd>Space</kbd> / <kbd>↑</kbd> / <kbd>Tap</kbd> to jump &nbsp;|&nbsp; Double jump allowed</p>
  </div>
  <div id="gameOverScreen" class="overlay hidden">
    <h2>GAME OVER</h2>
    <p id="deathMsg" class="death-msg"></p>
    <p id="finalScore"></p>
    <p id="highScore"></p>
    <button id="restartBtn" class="btn">TRY AGAIN</button>
  </div>
  <div id="hud" class="hidden">
    <span id="scoreDisplay">Score: 0</span>
    <span id="distDisplay">0 m</span>
  </div>
</div>
<script>
// ─── constants ───────────────────────────────────────────────────────────────
const W=900,H=506,GROUND_Y=H-80,GRAVITY=1900,JUMP_VEL=-700,
      BASE_SPEED=420,SPEED_INCREMENT=22,MAX_SPEED=1300,
      PLAYER_W=30,PLAYER_H=58,PLAYER_X=130,
      OBS_TYPES=['low','mid','high','wide'],COIN_R=10;
const COL={sky1:'#0d0d1a',sky2:'#1a0a2e',ground:'#1e1b4b',groundL:'#312e81',
  skin:'#fbbf24',shirt:'#3b82f6',pants:'#1e3a8a',shoes:'#422006',shadow:'#0000004d',
  obs:'#f43f5e',obsD:'#9f1239',coin:'#fbbf24',coinG:'#f59e0b',star:'#ffffff',
  snake:'#16a34a',snakeD:'#14532d',snakeEye:'#fef08a',
  fish:'#0ea5e9',fishD:'#0369a1',fishBelly:'#e0f2fe',fishEye:'#fef08a',danger:'#ff0000'};

// ─── ParticleSystem ──────────────────────────────────────────────────────────
class ParticleSystem{
  constructor(){this.particles=[]}
  emit(x,y,count,opts={}){
    for(let i=0;i<count;i++){
      const angle=opts.angle??Math.random()*Math.PI*2;
      const spread=opts.spread??Math.PI*2;
      const a=angle-spread/2+Math.random()*spread;
      const spd=(opts.speed??80)*(0.5+Math.random());
      this.particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-(opts.upBias??40),
        life:1,decay:opts.decay??(1.8+Math.random()*1.2),r:opts.r??(3+Math.random()*4),
        color:opts.color??'#7c3aed',gravity:opts.gravity??400});
    }
  }
  update(dt){
    for(const p of this.particles){p.life-=p.decay*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.gravity*dt;p.r*=0.97}
    this.particles=this.particles.filter(p=>p.life>0);
  }
  draw(ctx){
    for(const p of this.particles){
      ctx.save();ctx.globalAlpha=Math.max(0,p.life)*0.85;ctx.fillStyle=p.color;
      ctx.shadowColor=p.color;ctx.shadowBlur=6;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore();
    }
  }
}

// ─── Background ──────────────────────────────────────────────────────────────
class Background{
  constructor(){
    this.stars=Array.from({length:120},()=>({x:Math.random()*W,y:Math.random()*(GROUND_Y-60),r:Math.random()*1.5+0.3,twinkle:Math.random()*Math.PI*2,speed:0.15+Math.random()*0.15}));
    this.mountains=Array.from({length:6},(_,i)=>({x:i*(W/5),h:60+Math.random()*80,w:180+Math.random()*140,speed:0.06}));
    this.hills=Array.from({length:8},(_,i)=>({x:i*(W/7),h:30+Math.random()*40,w:140+Math.random()*100,speed:0.2}));
    this.groundTiles=Array.from({length:20},(_,i)=>({x:i*(W/18)}));
    this.t=0;
  }
  update(dt,speed){
    this.t+=dt;
    for(const s of this.stars){s.twinkle+=dt*1.8;s.x-=speed*s.speed*dt;if(s.x<-4)s.x=W+4}
    for(const m of this.mountains){m.x-=speed*m.speed*dt;if(m.x+m.w<-10)m.x=W+Math.random()*80}
    for(const h of this.hills){h.x-=speed*h.speed*dt;if(h.x+h.w<-10)h.x=W+Math.random()*60}
    for(const t of this.groundTiles){t.x-=speed*dt;if(t.x<-W/18)t.x+=W+W/18}
  }
  draw(ctx){
    const skyG=ctx.createLinearGradient(0,0,0,GROUND_Y);
    skyG.addColorStop(0,'#050510');skyG.addColorStop(1,'#1a0a2e');
    ctx.fillStyle=skyG;ctx.fillRect(0,0,W,H);
    for(const s of this.stars){
      ctx.save();ctx.globalAlpha=0.5+Math.sin(s.twinkle)*0.45;ctx.fillStyle=COL.star;
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();ctx.restore();
    }
    for(const m of this.mountains){
      ctx.save();ctx.globalAlpha=0.22;ctx.fillStyle='#7c3aed';
      ctx.beginPath();ctx.moveTo(m.x,GROUND_Y);ctx.lineTo(m.x+m.w/2,GROUND_Y-m.h);ctx.lineTo(m.x+m.w,GROUND_Y);ctx.fill();ctx.restore();
    }
    for(const h of this.hills){
      ctx.save();ctx.globalAlpha=0.35;ctx.fillStyle='#312e81';
      ctx.beginPath();ctx.moveTo(h.x,GROUND_Y);ctx.bezierCurveTo(h.x+h.w*0.25,GROUND_Y-h.h*1.2,h.x+h.w*0.75,GROUND_Y-h.h*1.2,h.x+h.w,GROUND_Y);ctx.fill();ctx.restore();
    }
    ctx.fillStyle=COL.ground;ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);
    const lineG=ctx.createLinearGradient(0,GROUND_Y,W,GROUND_Y);
    lineG.addColorStop(0,'#7c3aed');lineG.addColorStop(0.5,'#06b6d4');lineG.addColorStop(1,'#7c3aed');
    ctx.fillStyle=lineG;ctx.fillRect(0,GROUND_Y,W,3);
    ctx.strokeStyle='#ffffff0d';ctx.lineWidth=1;
    for(const t of this.groundTiles){ctx.beginPath();ctx.moveTo(t.x,GROUND_Y);ctx.lineTo(t.x,H);ctx.stroke()}
    ctx.save();
    const hg=ctx.createLinearGradient(0,GROUND_Y-30,0,GROUND_Y+10);
    hg.addColorStop(0,'rgba(124,58,237,0)');hg.addColorStop(0.6,'rgba(124,58,237,0.12)');hg.addColorStop(1,'rgba(124,58,237,0)');
    ctx.fillStyle=hg;ctx.fillRect(0,GROUND_Y-30,W,40);ctx.restore();
  }
}

// ─── Player ──────────────────────────────────────────────────────────────────
class Player{
  constructor(){
    this.x=PLAYER_X;this.y=GROUND_Y-PLAYER_H;this.vy=0;this.jumpsLeft=2;
    this.onGround=true;this.trail=[];this.frame=0;this.dead=false;
    this.squash=1;this.stretch=1;this.armSwing=0;this.panic=0;
  }
  jump(){
    if(this.dead)return;
    if(this.jumpsLeft>0){this.vy=JUMP_VEL*(this.jumpsLeft<2?0.80:1);this.jumpsLeft--;this.onGround=false;this.stretch=1.3;this.squash=0.78}
  }
  setPanic(v){this.panic=Math.min(1,v)}
  update(dt){
    if(this.dead){this.vy+=GRAVITY*dt;this.y+=this.vy*dt;return}
    this.vy+=GRAVITY*dt;this.y+=this.vy*dt;
    if(this.y>=GROUND_Y-PLAYER_H){
      this.y=GROUND_Y-PLAYER_H;this.vy=0;this.jumpsLeft=2;
      if(!this.onGround){this.squash=0.68;this.stretch=1.28}
      this.onGround=true;
    }else{this.onGround=false}
    this.squash+=(1-this.squash)*Math.min(1,dt*14);
    this.stretch+=(1-this.stretch)*Math.min(1,dt*14);
    const rs=this.onGround?14:5;this.frame+=dt*rs;this.armSwing+=dt*rs;
    this.trail.push({x:this.x+PLAYER_W/2,y:this.y+PLAYER_H/2,age:0});
    if(this.trail.length>8)this.trail.shift();
    for(const t of this.trail)t.age+=dt;
  }
  get hitbox(){const p=6;return{x:this.x+p,y:this.y+p,w:PLAYER_W-p*2,h:PLAYER_H-p*2}}
  draw(ctx){
    for(let i=0;i<this.trail.length;i++){
      const t=this.trail[i];ctx.save();ctx.globalAlpha=(i/this.trail.length)*0.25;
      ctx.fillStyle='#3b82f6';ctx.beginPath();ctx.arc(t.x,t.y,6*(i/this.trail.length),0,Math.PI*2);ctx.fill();ctx.restore();
    }
    const cx=this.x+PLAYER_W/2,topY=this.y;
    ctx.save();ctx.translate(cx,topY+PLAYER_H/2);ctx.scale(this.squash,this.stretch);
    const hy=-PLAYER_H/2,legSwing=Math.sin(this.frame)*(this.onGround?12:4),legW=9,legH=18,legY=PLAYER_H/2-legH-2;
    // left leg
    ctx.save();ctx.translate(-6,legY);ctx.rotate(legSwing*0.05);ctx.fillStyle=COL.pants;ctx.fillRect(-legW/2,0,legW,legH);ctx.fillStyle=COL.shoes;ctx.fillRect(-legW/2-2,legH-4,legW+6,6);ctx.restore();
    // right leg
    ctx.save();ctx.translate(6,legY);ctx.rotate(-legSwing*0.05);ctx.fillStyle=COL.pants;ctx.fillRect(-legW/2,0,legW,legH);ctx.fillStyle=COL.shoes;ctx.fillRect(-legW/2-2,legH-4,legW+6,6);ctx.restore();
    // torso
    const torsoH=22,torsoW=PLAYER_W-2,torsoY=hy+18;
    ctx.fillStyle=COL.shirt;ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(-torsoW/2,torsoY,torsoW,torsoH,4);else ctx.rect(-torsoW/2,torsoY,torsoW,torsoH);
    ctx.fill();ctx.fillStyle='#60a5fa';ctx.fillRect(-torsoW/2+4,torsoY+6,torsoW-8,4);
    // arms
    const aSwing=Math.sin(this.armSwing)*(this.onGround?14:5);
    const pWave=this.panic>0.3?Math.sin(this.frame*3)*20:0;
    const armW=7,armH=16;
    ctx.save();ctx.translate(-torsoW/2-1,torsoY+2);ctx.rotate((-aSwing+pWave)*0.06);ctx.fillStyle=COL.shirt;ctx.fillRect(-armW/2,0,armW,armH);ctx.fillStyle=COL.skin;ctx.beginPath();ctx.arc(0,armH+3,4,0,Math.PI*2);ctx.fill();ctx.restore();
    ctx.save();ctx.translate(torsoW/2+1,torsoY+2);ctx.rotate((aSwing+pWave)*0.06);ctx.fillStyle=COL.shirt;ctx.fillRect(-armW/2,0,armW,armH);ctx.fillStyle=COL.skin;ctx.beginPath();ctx.arc(0,armH+3,4,0,Math.PI*2);ctx.fill();ctx.restore();
    // neck + head
    ctx.fillStyle=COL.skin;ctx.fillRect(-4,hy+12,8,8);
    const headR=14,headCY=hy+headR;
    ctx.fillStyle=COL.skin;ctx.beginPath();ctx.arc(0,headCY,headR,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#92400e';ctx.beginPath();ctx.arc(0,headCY,headR,Math.PI,0);ctx.fill();
    ctx.beginPath();ctx.arc(0,headCY-headR+4,headR*0.55,0,Math.PI*2);ctx.fill();
    const eSize=2.5+this.panic*2;
    ctx.fillStyle='#1e1b4b';
    ctx.beginPath();ctx.arc(-5,headCY-1,eSize,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(5,headCY-1,eSize,0,Math.PI*2);ctx.fill();
    if(this.panic>0.4){
      ctx.fillStyle='#fff';ctx.globalAlpha=this.panic*0.8;
      ctx.beginPath();ctx.arc(-5,headCY-1,eSize+1.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#1e1b4b';ctx.globalAlpha=1;
      ctx.beginPath();ctx.arc(-5,headCY-1,eSize,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(5,headCY-1,eSize,0,Math.PI*2);ctx.fill();
    }
    ctx.strokeStyle='#92400e';ctx.lineWidth=1.5;ctx.beginPath();
    ctx.arc(0,headCY+(this.panic>0.5?5:6),4,0,Math.PI);ctx.stroke();
    ctx.restore();
    ctx.save();ctx.globalAlpha=0.22;ctx.fillStyle='#000';
    ctx.beginPath();ctx.ellipse(cx,GROUND_Y-2,PLAYER_W*0.55*this.squash,5,0,0,Math.PI*2);ctx.fill();ctx.restore();
  }
}

// ─── Obstacle ────────────────────────────────────────────────────────────────
const OBS_CFG={low:{w:28,h:40,yOff:0,color:COL.obs,dark:COL.obsD},mid:{w:22,h:70,yOff:0,color:'#a855f7',dark:'#7e22ce'},high:{w:20,h:32,yOff:-90,color:'#f97316',dark:'#c2410c'},wide:{w:60,h:28,yOff:0,color:COL.obs,dark:COL.obsD}};
class Obstacle{
  constructor(type,speed){
    const c=OBS_CFG[type]||OBS_CFG.low;
    this.w=c.w+Math.random()*10|0;this.h=c.h+Math.random()*14|0;
    this.x=W+40;this.y=GROUND_Y-this.h+c.yOff;
    this.color=c.color;this.dark=c.dark;this.speed=speed;
    this.spikes=type==='low'||type==='wide';this.type=type;
  }
  update(dt,speed){this.x-=speed*dt}
  get hitbox(){const p=4;return{x:this.x+p,y:this.y+p,w:this.w-p*2,h:this.h-p*2}}
  get offscreen(){return this.x+this.w<-10}
  draw(ctx){
    const{x,y,w,h}=this;
    const g=ctx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,this.color);g.addColorStop(1,this.dark);
    ctx.fillStyle=g;ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(x,y,w,h,5);else ctx.rect(x,y,w,h);ctx.fill();
    if(this.spikes){
      const count=Math.max(2,w/14|0),sw=w/count;ctx.fillStyle=this.color;
      for(let i=0;i<count;i++){ctx.beginPath();ctx.moveTo(x+i*sw,y);ctx.lineTo(x+i*sw+sw/2,y-14);ctx.lineTo(x+(i+1)*sw,y);ctx.fill()}
    }
    ctx.save();ctx.shadowColor=this.color;ctx.shadowBlur=12;ctx.strokeStyle=this.color;ctx.lineWidth=1;
    ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,5);else ctx.rect(x,y,w,h);ctx.stroke();ctx.restore();
  }
}

// ─── Coin ────────────────────────────────────────────────────────────────────
class Coin{
  constructor(x,y){
    this.x=x;this.y=y??(GROUND_Y-COIN_R*2-20-Math.random()*80);
    this.r=COIN_R;this.collected=false;this.animT=Math.random()*Math.PI*2;this.sparkles=[];
  }
  update(dt,speed){
    this.x-=speed*dt;this.animT+=dt*3;
    for(const s of this.sparkles){s.age+=dt;s.x+=s.vx*dt;s.y+=s.vy*dt}
    this.sparkles=this.sparkles.filter(s=>s.age<0.4);
  }
  collect(){
    this.collected=true;
    for(let i=0;i<8;i++){const a=(i/8)*Math.PI*2;this.sparkles.push({x:this.x,y:this.y,vx:Math.cos(a)*60,vy:Math.sin(a)*60,age:0})}
  }
  get hitbox(){return{x:this.x-this.r,y:this.y-this.r,w:this.r*2,h:this.r*2}}
  get offscreen(){return this.x+this.r<-10}
  draw(ctx){
    for(const s of this.sparkles){ctx.save();ctx.globalAlpha=Math.max(0,1-s.age/0.4);ctx.fillStyle=COL.coin;ctx.beginPath();ctx.arc(s.x,s.y,3,0,Math.PI*2);ctx.fill();ctx.restore()}
    if(this.collected)return;
    const bob=Math.sin(this.animT)*4,cx=this.x,cy=this.y+bob;
    ctx.save();ctx.shadowColor=COL.coin;ctx.shadowBlur=14;
    const g=ctx.createRadialGradient(cx-3,cy-3,2,cx,cy,this.r);
    g.addColorStop(0,'#fde68a');g.addColorStop(1,COL.coinG);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,this.r,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=0.5;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx-3,cy-3,4,0,Math.PI*2);ctx.fill();ctx.restore();
  }
}

// ─── Snake ───────────────────────────────────────────────────────────────────
const SEG=14,SEG_R=9;
class Snake{
  constructor(speed){
    this.segments=[];
    const sx=W+60,sy=GROUND_Y-SEG_R;
    for(let i=0;i<SEG;i++)this.segments.push({x:sx+i*SEG_R*1.4,y:sy});
    this.speed=speed;this.chaseSpeed=speed*0.28;this.t=0;this.tongueTimer=0;this.tongueFull=false;
  }
  get head(){return this.segments[0]}
  get offscreen(){return this.head.x+SEG_R*SEG<-20}
  get hitbox(){const h=this.head;return{x:h.x-SEG_R,y:h.y-SEG_R,w:SEG_R*2.2,h:SEG_R*2.2}}
  update(dt,speed,px,py){
    this.t+=dt;this.tongueTimer+=dt;
    if(this.tongueTimer>0.6){this.tongueFull=!this.tongueFull;this.tongueTimer=0}
    const head=this.head;
    const dx=px-head.x,dy=(py+20)-head.y,dist=Math.sqrt(dx*dx+dy*dy)||1;
    const cx=dist>5?(dx/dist)*this.chaseSpeed:0,cy=dist>5?(dy/dist)*this.chaseSpeed*0.4:0;
    head.x-=speed*dt;head.x+=cx*dt*60;
    head.y=(GROUND_Y-SEG_R)+Math.sin(this.t*4)*6+cy*dt*60;
    head.y=Math.min(GROUND_Y-SEG_R,head.y);
    for(let i=1;i<this.segments.length;i++){
      const prev=this.segments[i-1],curr=this.segments[i];
      const ddx=curr.x-prev.x,ddy=curr.y-prev.y,len=Math.sqrt(ddx*ddx+ddy*ddy)||1,td=SEG_R*1.35;
      if(len>td){curr.x=prev.x+(ddx/len)*td;curr.y=prev.y+(ddy/len)*td}
    }
  }
  draw(ctx){
    for(let i=this.segments.length-1;i>=0;i--){
      const s=this.segments[i],t=i/(this.segments.length-1),r=SEG_R*(0.55+0.45*t);
      const g=ctx.createRadialGradient(s.x-r*0.3,s.y-r*0.3,r*0.1,s.x,s.y,r);
      g.addColorStop(0,'#4ade80');g.addColorStop(1,COL.snakeD);
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,r,0,Math.PI*2);ctx.fill();
      if(i>0&&i%2===0){ctx.strokeStyle='#15803d';ctx.lineWidth=0.8;ctx.globalAlpha=0.5;ctx.beginPath();ctx.arc(s.x,s.y,r*0.7,0.3,Math.PI-0.3);ctx.stroke();ctx.globalAlpha=1}
    }
    const head=this.segments[0];
    ctx.fillStyle=COL.snakeEye;
    ctx.beginPath();ctx.arc(head.x-4,head.y-4,3.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(head.x+4,head.y-4,3.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(head.x-4,head.y-4,1.8,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(head.x+4,head.y-4,1.8,0,Math.PI*2);ctx.fill();
    const tlen=this.tongueFull?14:8;
    ctx.strokeStyle='#f43f5e';ctx.lineWidth=1.5;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(head.x,head.y+3);ctx.lineTo(head.x-3,head.y+3+tlen);ctx.moveTo(head.x,head.y+3);ctx.lineTo(head.x+3,head.y+3+tlen);ctx.stroke();
    ctx.save();ctx.shadowColor='#16a34a';ctx.shadowBlur=18;ctx.globalAlpha=0.3;ctx.fillStyle='#16a34a';
    ctx.beginPath();ctx.arc(head.x,head.y,SEG_R*1.5,0,Math.PI*2);ctx.fill();ctx.restore();
  }
}

// ─── FlyingFish ──────────────────────────────────────────────────────────────
class FlyingFish{
  constructor(speed){
    this.x=W+60;this.y=80+Math.random()*(GROUND_Y-180);
    this.speed=speed;this.vx=-(speed*0.55);this.vy=0;this.t=0;
    this.phase='approach';this.diveTriggered=false;this.finFlap=0;
    this.bubbles=[];this.bubbleTimer=0;
  }
  get offscreen(){return this.x+60<-20||this.y>H+60}
  get hitbox(){return{x:this.x-22,y:this.y-14,w:44,h:28}}
  triggerDive(px,py){
    if(this.diveTriggered)return;this.diveTriggered=true;this.phase='dive';
    const dx=(px+15)-this.x,dy=(py+20)-this.y,dist=Math.sqrt(dx*dx+dy*dy)||1,spd=this.speed*0.9;
    this.vx=(dx/dist)*spd;this.vy=(dy/dist)*spd;
  }
  update(dt,speed,px,py){
    this.t+=dt;this.finFlap+=dt*8;this.bubbleTimer+=dt;
    if(this.phase==='approach'){
      this.x+=this.vx*dt;this.y+=Math.sin(this.t*2.5)*55*dt;
      if(this.x<px+280&&!this.diveTriggered)this.triggerDive(px,py);
    }else if(this.phase==='dive'){
      this.x+=this.vx*dt;this.y+=this.vy*dt;
      if(this.y>GROUND_Y-30||this.x<px-100){this.phase='recover';this.vy=-this.speed*0.7;this.vx=-speed*0.5}
    }else{this.x+=this.vx*dt;this.y+=this.vy*dt;this.vy+=200*dt}
    if(this.bubbleTimer>0.08){this.bubbleTimer=0;this.bubbles.push({x:this.x+20,y:this.y,r:2+Math.random()*3,age:0})}
    for(const b of this.bubbles){b.age+=dt;b.y-=18*dt;b.x+=5*dt}
    this.bubbles=this.bubbles.filter(b=>b.age<0.6);
  }
  draw(ctx){
    for(const b of this.bubbles){ctx.save();ctx.globalAlpha=Math.max(0,1-b.age/0.6)*0.4;ctx.strokeStyle='#7dd3fc';ctx.lineWidth=1;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();ctx.restore()}
    const{x,y}=this,angle=Math.atan2(this.vy,this.vx);
    ctx.save();ctx.translate(x,y);ctx.rotate(angle);
    ctx.shadowColor=COL.fish;ctx.shadowBlur=20;
    ctx.fillStyle=COL.fish;ctx.beginPath();ctx.ellipse(0,0,26,13,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=COL.fishBelly;ctx.beginPath();ctx.ellipse(2,4,18,7,0,0,Math.PI*2);ctx.fill();
    const flapY=Math.sin(this.finFlap)*6;
    ctx.fillStyle=COL.fishD;ctx.beginPath();ctx.moveTo(22,0);ctx.lineTo(36,-10+flapY);ctx.lineTo(36,10-flapY);ctx.closePath();ctx.fill();
    ctx.fillStyle=COL.fishD;ctx.beginPath();ctx.moveTo(-4,-13);ctx.lineTo(6,-22+Math.sin(this.finFlap*1.3)*4);ctx.lineTo(14,-13);ctx.closePath();ctx.fill();
    ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.moveTo(2,0);ctx.lineTo(-6,14+Math.sin(this.finFlap*1.5)*5);ctx.lineTo(10,10);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#0284c7';ctx.lineWidth=0.8;ctx.globalAlpha=0.4;
    for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(-8+i*10,0,7,0.3,Math.PI-0.3);ctx.stroke()}
    ctx.globalAlpha=1;ctx.shadowBlur=0;
    ctx.fillStyle=COL.fishEye;ctx.beginPath();ctx.arc(-14,-3,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(-15,-3,2.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-16,-4.5,1.2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-24,0);
    for(let i=0;i<4;i++){ctx.lineTo(-24+i*4,-8);ctx.lineTo(-22+i*4,0)}ctx.fill();
    ctx.restore();
    if(this.y<10&&this.phase!=='recover'){
      ctx.save();ctx.fillStyle='#f43f5e';ctx.globalAlpha=0.7+Math.sin(this.t*10)*0.3;
      ctx.font='bold 14px monospace';ctx.fillText('▼ FISH',Math.max(20,Math.min(W-80,x)),18);ctx.restore();
    }
  }
}

// ─── Runner ──────────────────────────────────────────────────────────────────
function rectsOverlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

class Runner{
  constructor(canvas,onTick,onGameOver){
    this.canvas=canvas;this.ctx=canvas.getContext('2d');
    this.onTick=onTick;this.onGameOver=onGameOver;
    canvas.width=W;canvas.height=H;
    this._bindInput();
  }
  _reset(){
    this.player=new Player();this.obstacles=[];this.coins=[];this.snakes=[];this.fish=[];
    this.bg=new Background();this.particles=new ParticleSystem();
    this.speed=BASE_SPEED;this.score=0;this.meters=0;this.scoreAcc=0;this.metersAcc=0;
    this.nextObs=1400;this.nextCoin=700;this.nextSnake=4000;this.nextFish=5500;
    this.running=false;this._raf=null;this._lastTime=0;
  }
  start(){this._reset();this.running=true;this._lastTime=performance.now();this._raf=requestAnimationFrame(this._loop.bind(this))}
  destroy(){this.running=false;if(this._raf)cancelAnimationFrame(this._raf);this._removeInput()}
  _bindInput(){
    this._onKey=e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();this.player?.jump()}};
    this._onTouch=()=>this.player?.jump();
    window.addEventListener('keydown',this._onKey);
    this.canvas.addEventListener('pointerdown',this._onTouch);
  }
  _removeInput(){window.removeEventListener('keydown',this._onKey);this.canvas.removeEventListener('pointerdown',this._onTouch)}
  _loop(now){
    if(!this.running)return;
    const dt=Math.min((now-this._lastTime)/1000,0.05);this._lastTime=now;
    this._update(dt);this._draw();this._raf=requestAnimationFrame(this._loop.bind(this));
  }
  _update(dt){
    const{player,particles}=this;
    this.speed=Math.min(MAX_SPEED,BASE_SPEED+Math.floor(this.score/80)*SPEED_INCREMENT);
    this.scoreAcc+=this.speed*dt*0.045;this.metersAcc+=this.speed*dt*0.055;
    const ns=Math.floor(this.scoreAcc);
    if(ns!==this.score){this.score=ns;this.onTick(this.score,Math.floor(this.metersAcc))}
    this.meters=Math.floor(this.metersAcc);
    this.bg.update(dt,this.speed);particles.update(dt);
    if(!player.dead){
      let md=Infinity;
      for(const s of this.snakes)md=Math.min(md,Math.abs(s.head.x-player.x));
      for(const f of this.fish)md=Math.min(md,Math.hypot(f.x-player.x,f.y-player.y));
      player.setPanic(md<250?1-md/250:0);
    }
    player.update(dt);
    if(player.onGround&&!player.dead&&Math.random()<0.35)
      particles.emit(player.x+4,GROUND_Y-2,1,{color:'#3b82f6',speed:25,angle:Math.PI,spread:0.5,r:2,decay:4,gravity:80,upBias:0});
    this.nextObs-=dt*1000;
    if(this.nextObs<=0){
      this.obstacles.push(new Obstacle(OBS_TYPES[Math.floor(Math.random()*OBS_TYPES.length)],this.speed));
      this.nextObs=Math.max(420,1000-this.score*0.7)+Math.random()*500;
    }
    if(this.score>50){this.nextSnake-=dt*1000;if(this.nextSnake<=0){this.snakes.push(new Snake(this.speed));this.nextSnake=Math.max(3000,7000-this.score*4)+Math.random()*2000}}
    if(this.score>120){this.nextFish-=dt*1000;if(this.nextFish<=0){this.fish.push(new FlyingFish(this.speed));this.nextFish=Math.max(2800,7000-this.score*3.5)+Math.random()*2000}}
    this.nextCoin-=dt*1000;
    if(this.nextCoin<=0){const cols=1+(Math.random()<0.4?2:0);for(let i=0;i<cols;i++)this.coins.push(new Coin(W+40+i*30));this.nextCoin=600+Math.random()*800}
    for(const o of this.obstacles)o.update(dt,this.speed);this.obstacles=this.obstacles.filter(o=>!o.offscreen);
    for(const c of this.coins)c.update(dt,this.speed);this.coins=this.coins.filter(c=>!c.offscreen);
    for(const s of this.snakes)s.update(dt,this.speed,player.x,player.y);this.snakes=this.snakes.filter(s=>!s.offscreen);
    for(const f of this.fish)f.update(dt,this.speed,player.x,player.y);this.fish=this.fish.filter(f=>!f.offscreen);
    if(player.dead)return;
    const ph=player.hitbox;
    for(const o of this.obstacles)if(rectsOverlap(ph,o.hitbox)){this._die('obs');return}
    for(const s of this.snakes)if(rectsOverlap(ph,s.hitbox)){this._die('snake');return}
    for(const f of this.fish)if(rectsOverlap(ph,f.hitbox)){this._die('fish');return}
    for(const c of this.coins)if(!c.collected&&rectsOverlap(ph,c.hitbox)){c.collect();this.scoreAcc+=10;particles.emit(c.x,c.y,8,{color:'#fbbf24',speed:80,r:3,decay:3,gravity:200,upBias:60})}
  }
  _die(cause){
    const p=this.player;p.dead=true;p.vy=-520;
    const cols={obs:['#f43f5e','#7c3aed'],snake:['#4ade80','#f43f5e'],fish:['#0ea5e9','#f43f5e']};
    const[c1,c2]=cols[cause]||cols.obs;
    this.particles.emit(p.x+15,p.y+28,28,{color:c1,speed:140,r:6,decay:1.3,gravity:500,upBias:90});
    this.particles.emit(p.x+15,p.y+28,18,{color:c2,speed:100,r:4,decay:1.9,gravity:380,upBias:60});
    setTimeout(()=>{if(this.running){this.running=false;this.onGameOver(this.score,this.meters,cause)}},950);
  }
  _draw(){
    const{ctx}=this;ctx.clearRect(0,0,W,H);
    this.bg.draw(ctx);this.particles.draw(ctx);
    for(const c of this.coins)c.draw(ctx);
    for(const o of this.obstacles)o.draw(ctx);
    for(const s of this.snakes)s.draw(ctx);
    for(const f of this.fish)f.draw(ctx);
    this.player.draw(ctx);
    const frac=(this.speed-BASE_SPEED)/(MAX_SPEED-BASE_SPEED);
    ctx.save();ctx.globalAlpha=0.55;
    const sg=ctx.createLinearGradient(0,0,W*frac,0);sg.addColorStop(0,'#3b82f6');sg.addColorStop(1,'#06b6d4');
    ctx.fillStyle=sg;ctx.fillRect(0,0,W*frac,3);ctx.restore();
    const ec=this.snakes.length+this.fish.length;
    if(ec>=2){ctx.save();ctx.globalAlpha=Math.min(0.12,ec*0.04);ctx.fillStyle='#f43f5e';ctx.fillRect(0,0,W,H);ctx.restore()}
  }
}

// ─── Main ────────────────────────────────────────────────────────────────────
const canvas=document.getElementById('gameCanvas');
const startScreen=document.getElementById('startScreen');
const gameOverScreen=document.getElementById('gameOverScreen');
const hud=document.getElementById('hud');
const scoreDisplay=document.getElementById('scoreDisplay');
const distDisplay=document.getElementById('distDisplay');
const finalScoreEl=document.getElementById('finalScore');
const highScoreEl=document.getElementById('highScore');
const deathMsgEl=document.getElementById('deathMsg');

let runner=null;
let highScore=parseInt(localStorage.getItem('gammee_hs')||'0',10);

const DEATH_MSGS={
  snake:['Swallowed by a snake!','Hissssss... game over.','The snake got you!'],
  fish:['Chomped by a flying fish!','Fish > Human.','That fish was FAST!'],
  obs:['You crashed!','Next time, jump!','Obstacle wins.'],
};

function startGame(){
  startScreen.classList.add('hidden');gameOverScreen.classList.add('hidden');hud.classList.remove('hidden');
  if(runner)runner.destroy();
  runner=new Runner(canvas,(score,meters)=>{scoreDisplay.textContent=`Score: ${score}`;distDisplay.textContent=`${meters} m`},(score,meters,cause='obs')=>{
    if(score>highScore){highScore=score;localStorage.setItem('gammee_hs',highScore)}
    hud.classList.add('hidden');
    const msgs=DEATH_MSGS[cause]||DEATH_MSGS.obs;
    deathMsgEl.textContent=msgs[Math.floor(Math.random()*msgs.length)];
    finalScoreEl.innerHTML=`Score: <span>${score}</span> &nbsp;|&nbsp; Distance: <span>${meters} m</span>`;
    highScoreEl.innerHTML=`Best: <span>${highScore}</span>`;
    gameOverScreen.classList.remove('hidden');
  });
  runner.start();
}

document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('restartBtn').addEventListener('click',startGame);
window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'){
    if(!startScreen.classList.contains('hidden'))startGame();
    else if(!gameOverScreen.classList.contains('hidden'))startGame();
  }
});
</script>
